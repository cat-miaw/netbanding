isps:
  - id: biznet
    note: "Ex-PPN prices; device rental 50rb/mo treated as final (verify vs PPN, blueprint Q2). Cards repeat 50 Mbps for all tiers; true speeds live in the comparison table."
    pages:
      - url: https://biznethome.net/product/packages
        mode: static
    aliases:
      biznet-home-0d-50: biznet-home-50
      biznet-home-internet-0d-50: biznet-home-50
      biznet-home-1d-150: biznet-home-150
      biznet-home-internet-1d-150: biznet-home-150
      biznet-home-2d-250: biznet-home-250
      biznet-home-internet-2d-250: biznet-home-250
      biznet-gamers-3d-300: biznet-gamers-300
      biznet-home-gamers-3d-300: biznet-gamers-300
  - id: myrepublic
    note: "Pricelist page is a JS shell (459 chars after cleaning); bot-safe extraction not possible with static fetch. Hand-curated seed until a manual refresh."
    extract: manual
    pages:
      - url: https://www.myrepublic.co.id/pricelist
        mode: static
  - id: firstmedia
    note: "Official domain (firstmedia-tv.id) is JS-walled; curated from official plan cards. 3 internet plans (250/350/400 Mbps, ex-PPN, free install). Reseller data retired 2026-10-07 (contradictory + wrong Superuser tier)."
    extract: manual
    default_regions: ["ID-JK", "ID-JB", "ID-BT"]
    pages:
      - url: https://firstmedia-tv.id/
        mode: static
  - id: telkomsel
    note: "Recommendation cards on /simpati via deterministic regex (name/quota/validity/price/Beli blocks). SERU packs live on a different page and are curated (keep). express-purchase needs a SIMPATI number (skeleton loaders) — out of scope."
    extractor: regex-telkomsel
    keep: [telkomsel-seru-harian-55gb, telkomsel-seru-harian-10gb,
      telkomsel-seru-harian-15gb, telkomsel-seru-mingguan-5gb,
      telkomsel-seru-mingguan-10gb, telkomsel-seru-mingguan-20gb,
      telkomsel-seru-bulanan-6gb, telkomsel-seru-bulanan-15gb]
    pages:
      - url: https://www.telkomsel.com/simpati
        mode: static
  - id: xl
    note: "Hub-discovered families (see quirks doc): ULTRA 5G+ JSON extractor runs per family page; unknown families trip review. Older Flex/VIP packs curated (keep). Prices vary by location picker; national defaults recorded."
    extractor: regex-xlultra
    hub: https://www.xl.co.id/produk/paket-dan-addon
    families:
      - slug: xl-ultra-5g
        url: https://www.xl.co.id/produk/paket-dan-addon/xl-ultra-5g
      - slug: xtra-combo-plus
        url: https://www.xl.co.id/id/produk/paket-dan-addon/xtra-combo-plus
      - slug: flexmax
        url: https://www.xl.co.id/produk/paket-dan-addon/flexmax
      - slug: flexmini
        url: https://www.xl.co.id/produk/paket-dan-addon/flexmini
      - slug: paket-akrab
        url: https://www.xl.co.id/id/produk/paket-dan-addon/paket-akrab
      - slug: bebas-puas
        url: https://www.xl.co.id/bebas-puas
      - slug: xtra-combo-mini
        url: https://www.xl.co.id/id/produk/paket-dan-addon/xtra-combo-mini
      - slug: xtra-combo-flex-mc
        url: https://www.xl.co.id/id/produk/paket-dan-addon/xtra-combo-flex-mc
    skip_families:
      flexmax: "duplicates curated Xtra Combo Flex S/M/L/XL line"
      flexmini: "duplicates curated line; same titles, no validity stated"
      bebas-puas: "custom sachet structure, no primeCardData; deferred"
      disneyplus: "streaming bundle, not a data pack"
      disneyplus: "streaming bundle, not a data pack"
    aliases:
      xl-xtra-combo-vip-plus-20-gb-30d: xl-xtra-combo-vip-20gb
      xl-xtra-combo-vip-plus-52-gb-30d: xl-xtra-combo-vip-52gb
      xl-xtra-combo-flex-s-28d: xl-xtra-combo-flex-s
    keep: [xl-xtra-combo-flex-s, xl-xtra-combo-flex-m, xl-xtra-combo-flex-l,
      xl-xtra-combo-flex-xl, xl-xtra-combo-vip-20gb, xl-xtra-combo-vip-52gb,
      xl-xtra-kuota-2gb]
    pages:
      - url: https://www.xl.co.id/produk/paket-dan-addon/xl-ultra-5g
        mode: static
settings:
  ppn_rate: 0.11
  deactivate_after_misses: 3
  review_price_change_pct: 30
