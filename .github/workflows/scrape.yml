name: scrape
on:
  schedule:
    - cron: "0 2 * * 1" # weekly Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      fetch_only:
        description: "Baseline page hashes only (no LLM, no data changes)"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Pipeline unit tests
        run: python -m pytest pipeline/tests/ -q
      - run: python pipeline/validate.py
        name: Validate seed contract
      - run: >-
          python pipeline/run.py
          ${{ inputs.fetch_only == true && '--fetch-only' || '' }}
        name: Run scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-run
          path: pipeline/runs/
      - name: Commit safe changes
        if: hashFiles('pipeline/review.json') == ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: weekly scrape update"
          file_pattern: "data/ pipeline/state/"
      - name: Open review PR
        if: hashFiles('pipeline/review.json') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "data: scraped changes needing review"
          title: "Review: suspicious price changes detected"
          body-path: pipeline/review.json
          branch: scrape-review
          add-paths: |
            data/
            pipeline/state/
