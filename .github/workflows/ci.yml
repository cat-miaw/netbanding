name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      # The ubuntu-latest runner image already has the Android SDK with licenses
      # accepted. android-actions/setup-android is deliberately not used: its
      # license step re-downloads cmdline-tools and fails on the preview-license
      # prompt. Gradle installs any missing platform/build-tools itself.

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # No daemon: the first build in CI should be as reproducible as a
      # developer's first build. The Gradle build cache still applies.
      - name: Lint
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release assemble
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn