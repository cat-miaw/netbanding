# --- JVM / build speed -------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately off. AGP 8.7.x cannot serialize
# `aarMetadataArtifacts` on CheckAarMetadataTask, which fails the build rather
# than degrading. Re-enable it once the project moves to an AGP version that
# serializes cleanly — the payoff is real, so this is worth revisiting.
org.gradle.configuration-cache=false

# --- Kotlin ------------------------------------------------------------------
# Strong skipping is default-on in Kotlin 2.0.20+. Explicit for clarity.
kotlin.code.style=official
kotlin.incremental=true

# --- Android -----------------------------------------------------------------
# Required: every dependency here is AndroidX.
android.useAndroidX=true

# Only package resources you actually use; keeps the APK small.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# --- Compose -----------------------------------------------------------------
# Smaller, faster R8 output for Compose.
android.enableR8.fullMode=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
